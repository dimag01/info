<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личные сообщения</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
    <style>
        :root {
            --bg-dark: #0b0614;
            --card-bg: rgba(21, 12, 37, 0.85);
            --accent-soft: rgba(168, 85, 247, 0.2);
            --text-main: #f3efff;
            --text-muted: #a699c4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Летающие символы на фоне */
        .ambient-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .floater {
            position: absolute; bottom: -40px; opacity: 0;
            animation: floatUp linear infinite; user-select: none;
            filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.5));
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            15% { opacity: 0.45; }
            85% { opacity: 0.35; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.1); opacity: 0; }
        }

        /* Общие карточки в твоём стиле */
        .vibe-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.28);
            border-radius: 24px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
            transition: border-color 0.3s ease;
        }
        .vibe-card:hover { border-color: rgba(192, 132, 252, 0.55); }

        h1, h2 {
            background: linear-gradient(90deg, #ffffff, #d8b4fe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Экран входа */
        .auth-wrap {
            position: relative; z-index: 2; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .auth-card { padding: 32px; width: 100%; max-width: 400px; text-align: center; }

        /* Основная сетка страницы */
        .page-layout {
            position: relative; z-index: 2;
            max-width: 1120px; margin: 0 auto; padding: 24px 20px;
            min-height: 100vh;
            display: none;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        /* Левая колонка: Профиль сверху слева */
        .profile-panel { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
        .profile-badge {
            display: inline-flex; align-items: center; gap: 8px; font-size: 12px;
            color: #d8b4fe; background: rgba(168, 85, 247, 0.14);
            border: 1px solid rgba(168, 85, 247, 0.35); padding: 4px 12px;
            border-radius: 20px; width: fit-content;
        }
        .pulse-dot {
            width: 8px; height: 8px; background: #c084fc; border-radius: 50%;
            box-shadow: 0 0 10px #c084fc; animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.4; }
        }

        /* Правая область: Чаты + Окно переписки */
        .right-workspace {
            display: grid;
            grid-template-columns: 1fr 240px;
            gap: 20px;
            height: calc(100vh - 48px);
            min-height: 520px;
        }

        /* Окно самого чата */
        .chat-window {
            padding: 22px; display: flex; flex-direction: column; height: 100%;
        }
        .chat-top {
            padding-bottom: 14px; margin-bottom: 14px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.25);
            display: flex; align-items: center; justify-content: space-between;
        }
        .chat-messages {
            flex: 1; overflow-y: auto; background: rgba(11, 6, 20, 0.72);
            border: 1px solid rgba(168, 85, 247, 0.28); border-radius: 18px;
            padding: 16px; display: flex; flex-direction: column; gap: 10px;
        }
        .chat-messages::-webkit-scrollbar, .users-scroll::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-thumb, .users-scroll::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.4); border-radius: 6px;
        }

        /* Пузыри сообщений */
        .msg-bubble {
            max-width: 75%; padding: 10px 14px; border-radius: 16px;
            font-size: 14px; line-height: 1.45; word-break: break-word;
        }
        .msg-me {
            align-self: flex-end;
            background: rgba(168, 85, 247, 0.42);
            border: 1px solid rgba(192, 132, 252, 0.55);
            color: #fff;
        }
        .msg-them {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(168, 85, 247, 0.22);
            color: #f3efff;
        }
        .msg-time {
            display: block; font-size: 11px; color: var(--text-muted);
            text-align: right; margin-top: 3px;
        }

        /* Список чатов справа */
        .chats-sidebar {
            padding: 20px 16px; display: flex; flex-direction: column; height: 100%;
        }
        .users-scroll {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
            margin-top: 12px; padding-right: 4px;
        }
        .user-item {
            width: 100%; text-align: left; padding: 10px 12px; border-radius: 14px;
            border: 1px solid rgba(168, 85, 247, 0.25); background: rgba(168, 85, 247, 0.1);
            color: #f3efff; font-size: 14px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        .user-item:hover { background: rgba(168, 85, 247, 0.24); transform: translateX(-2px); }
        .user-item.active {
            background: rgba(168, 85, 247, 0.35);
            border-color: #c084fc;
            box-shadow: 0 0 16px rgba(168, 85, 247, 0.25);
        }

        /* Поля ввода и кнопки */
        .vibe-input {
            background: rgba(11, 6, 20, 0.85); border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 12px; padding: 10px 14px; color: #f3efff; font-size: 14px; outline: none;
            width: 100%;
        }
        .vibe-input:focus { border-color: #c084fc; }
        .vibe-btn {
            background: rgba(168, 85, 247, 0.28); border: 1px solid rgba(192, 132, 252, 0.55);
            color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px;
            font-weight: 500; cursor: pointer; transition: 0.2s; text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .vibe-btn:hover { background: rgba(168, 85, 247, 0.48); transform: translateY(-1px); }
        .btn-danger {
            background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.35);
            color: #f87171;
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.3); }

        @media (max-width: 900px) {
            .page-layout { grid-template-columns: 1fr; }
            .right-workspace { grid-template-columns: 1fr; height: auto; }
            .chat-messages { height: 340px; }
        }
    </style>
</head>
<body>
    <div class="ambient-bg" id="ambient-bg"></div>

    <!-- Экран входа -->
    <div id="auth-box" class="auth-wrap">
        <div class="vibe-card auth-card">
            <div style="font-size: 38px; margin-bottom: 10px;">🔮</div>
            <h1 style="font-size: 24px; margin-bottom: 8px;">Личные сообщения</h1>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">
                Войди через Google, чтобы открыть свои диалоги:
            </p>
            <button id="btn-google" class="vibe-btn" style="width: 100%; font-weight: 600;">
                <span>🌐</span> <span>Войти через Google</span>
            </button>
            <div style="margin-top: 14px;">
                <a href="index.html" style="color: var(--text-muted); font-size: 13px; text-decoration: none;">← Вернуться на главную</a>
            </div>
            <p id="auth-error" style="color: #f87171; font-size: 13px; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- Основной экран ЛС -->
    <div id="dm-box" class="page-layout">
        
        <!-- СЛЕВА СВЕРХУ: Редактирование профиля -->
        <aside class="vibe-card profile-panel">
            <div class="profile-badge">
                <span class="pulse-dot"></span>
                <span>В сети • Профиль</span>
            </div>

            <!-- Просмотр ника -->
            <div id="profile-view" style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
                <div style="min-width: 0;">
                    <div style="font-size: 12px; color: var(--text-muted);">Твой никнейм</div>
                    <div id="current-user-name" style="font-size: 17px; font-weight: 600; color: #f3efff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">...</div>
                </div>
                <button id="btn-edit-nick" class="vibe-btn" style="padding: 8px 10px;" title="Изменить ник">✏️</button>
            </div>

            <!-- Форма смены ника -->
            <div id="profile-edit" style="display: none; flex-direction: column; gap: 8px;">
                <input type="text" id="new-nick-input" class="vibe-input" maxlength="20" placeholder="Новый ник">
                <div style="display: flex; gap: 6px;">
                    <button id="btn-save-nick" class="vibe-btn" style="flex: 1; padding: 6px;">Сохранить</button>
                    <button id="btn-cancel-nick" class="vibe-btn" style="padding: 6px 10px; background: transparent;">✕</button>
                </div>
            </div>

            <hr style="border: none; border-top: 1px solid rgba(168, 85, 247, 0.2);">

            <div style="display: flex; flex-direction: column; gap: 8px;">
                <a href="index.html" class="vibe-btn" style="width: 100%;">🏠 На главную</a>
                <button id="btn-logout" class="vibe-btn btn-danger" style="width: 100%;">Выйти из аккаунта</button>
            </div>
        </aside>

        <!-- СПРАВА: Сам чат и список диалогов -->
        <div class="right-workspace">
            
            <!-- Окно переписки -->
            <section class="vibe-card chat-window">
                <div class="chat-top">
                    <h2 id="chat-header" style="font-size: 19px;">Выбери собеседника справа 👉</h2>
                    <span style="font-size: 18px;">💬</span>
                </div>

                <div class="chat-messages" id="dm-messages">
                    <div style="margin: auto; text-align: center; color: var(--text-muted); font-size: 14px;">
                        Нажми на пользователя в списке справа, чтобы открыть переписку ✨
                    </div>
                </div>

                <div id="dm-input-area" style="display: none; gap: 10px; margin-top: 14px;">
                    <input type="text" id="dm-text" class="vibe-input" placeholder="Написать сообщение..." maxlength="400">
                    <button id="btn-send-dm" class="vibe-btn" style="padding: 10px 20px;">Отправить ➤</button>
                </div>
            </section>

            <!-- Список чатов справа -->
            <aside class="vibe-card chats-sidebar">
                <h2 style="font-size: 17px;">Чаты 👥</h2>
                <input type="text" id="search-users" class="vibe-input" placeholder="Поиск..." style="margin-top: 10px; padding: 8px 12px; font-size: 13px;">
                <div class="users-scroll" id="users-list"></div>
            </aside>

        </div>
    </div>

    <script>
        // Летающие символы как на главной
        const ambient = document.getElementById('ambient-bg');
        const symbols = ['✦', '🔮', '⚡', '🎧', '✨', '◈', '🌙'];
        for (let i = 0; i < 16; i++) {
            const el = document.createElement('div');
            el.className = 'floater';
            el.textContent = symbols[i % symbols.length];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = (12 + Math.random() * 14) + 'px';
            el.style.animationDuration = (10 + Math.random() * 14) + 's';
            el.style.animationDelay = (-Math.random() * 20) + 's';
            ambient.appendChild(el);
        }

        // Подключение Firebase
        const u1 = atob("aHR0cHM6Ly9jZG4uanNkZWxpdnIubmV0L25wbS9maXJlYmFzZUAxMC4xMi4yL2ZpcmViYXNlLWFwcC1jb21wYXQuanM=");
        const u2 = atob("aHR0cHM6Ly9jZG4uanNkZWxpdnIubmV0L25wbS9maXJlYmFzZUAxMC4xMi4yL2ZpcmViYXNlLWRhdGFiYXNlLWNvbXBhdC5qcw==");
        const u3 = atob("aHR0cHM6Ly9jZG4uanNkZWxpdnIubmV0L25wbS9maXJlYmFzZUAxMC4xMi4yL2ZpcmViYXNlLWF1dGgtY29tcGF0Lmpz");
        document.write('<scr' + 'ipt src="' + u1 + '"><\/scr' + 'ipt>');
        document.write('<scr' + 'ipt src="' + u2 + '"><\/scr' + 'ipt>');
        document.write('<scr' + 'ipt src="' + u3 + '"><\/scr' + 'ipt>');
    </script>
    <script>
        const pId = "chat-fa980";
        const firebaseConfig = {
            apiKey: "AIzaSyBzaz7xTbiHVuphhS7OzQsX7jmeCBAPbXQ",
            authDomain: pId + ".firebaseapp.com",
            databaseURL: "https://" + pId + "-default-rtdb.firebase" + "io.com",
            projectId: pId,
            storageBucket: pId + ".firebasestorage.app",
            messagingSenderId: "409114644202",
            appId: "1:409114644202:web:4693eb3d425ffc440d9193",
            measurementId: "G-DR972KJLWK"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const dmAuth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        let currentUser = null;
        let selectedFriend = null;
        let currentMessagesRef = null;
        let allUsersCache = [];

        const authBox = document.getElementById('auth-box');
        const dmBox = document.getElementById('dm-box');
        const authError = document.getElementById('auth-error');
        const usersListEl = document.getElementById('users-list');
        const messagesEl = document.getElementById('dm-messages');
        const chatHeader = document.getElementById('chat-header');
        const inputArea = document.getElementById('dm-input-area');
        const dmInput = document.getElementById('dm-text');

        // Вход через Google
        document.getElementById('btn-google').onclick = async () => {
            authError.style.color = "#d8b4fe";
            authError.textContent = "Открываем окно Google...";
            try {
                const res = await dmAuth.signInWithPopup(googleProvider);
                const u = res.user;
                const userRef = db.ref('users/' + u.uid);
                const snap = await userRef.once('value');
                const fallbackName = u.email ? u.email.substring(0, u.email.indexOf('@')) : 'Гость';

                if (!snap.exists() || !snap.val().username) {
                    await userRef.update({ username: u.displayName || fallbackName, email: u.email });
                } else {
                    await userRef.update({ email: u.email });
                }
                authError.textContent = "";
            } catch (e) {
                authError.style.color = "#f87171";
                authError.textContent = "Ошибка: " + e.message;
            }
        };

        document.getElementById('btn-logout').onclick = () => dmAuth.signOut();

        // Редактирование ника
        const profileView = document.getElementById('profile-view');
        const profileEdit = document.getElementById('profile-edit');
        const currentUserNameEl = document.getElementById('current-user-name');
        const newNickInput = document.getElementById('new-nick-input');

        document.getElementById('btn-edit-nick').onclick = () => {
            newNickInput.value = currentUserNameEl.textContent;
            profileView.style.display = 'none';
            profileEdit.style.display = 'flex';
            newNickInput.focus();
        };

        document.getElementById('btn-cancel-nick').onclick = () => {
            profileEdit.style.display = 'none';
            profileView.style.display = 'flex';
        };

        async function saveNewNick() {
            const newNick = newNickInput.value.trim();
            if (!newNick || !currentUser) return;
            await db.ref('users/' + currentUser.uid).update({ username: newNick });
            currentUserNameEl.textContent = newNick;
            profileEdit.style.display = 'none';
            profileView.style.display = 'flex';
        }

        document.getElementById('btn-save-nick').onclick = saveNewNick;
        newNickInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveNewNick(); });

        // Проверка статуса входа
        dmAuth.onAuthStateChanged(async (user) => {
            currentUser = user;
            if (user) {
                authBox.style.display = 'none';
                dmBox.style.display = 'grid';
                const fallbackName = user.email ? user.email.substring(0, user.email.indexOf('@')) : 'Гость';
                const snap = await db.ref('users/' + user.uid + '/username').once('value');
                currentUserNameEl.textContent = snap.val() || user.displayName || fallbackName;
                loadUsers();
            } else {
                authBox.style.display = 'flex';
                dmBox.style.display = 'none';
            }
        });

        // Список пользователей справа
        function loadUsers() {
            db.ref('users').on('value', (snapshot) => {
                const users = snapshot.val() || {};
                allUsersCache = Object.entries(users)
                    .filter(([uid]) => uid !== currentUser.uid)
                    .map(([uid, data]) => ({ uid, username: data.username || 'Пользователь' }));
                renderUsers(allUsersCache);
            });
        }

        function renderUsers(list) {
            usersListEl.innerHTML = '';
            if (list.length === 0) {
                usersListEl.innerHTML = '<div style="font-size:13px; color:var(--text-muted); text-align:center; margin-top:10px;">Никого нет</div>';
                return;
            }
            list.forEach((user) => {
                const btn = document.createElement('button');
                btn.className = 'user-item' + (selectedFriend && selectedFriend.uid === user.uid ? ' active' : '');
                btn.innerHTML = `<span>👤</span> <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${user.username}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll('.user-item').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    openChat(user.uid, user.username);
                };
                usersListEl.appendChild(btn);
            });
        }

        // Поиск в списке чатов
        document.getElementById('search-users').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase().trim();
            renderUsers(allUsersCache.filter(u => u.username.toLowerCase().includes(q)));
        });

        // Открытие диалога
        function openChat(friendUid, friendName) {
            selectedFriend = { uid: friendUid, name: friendName };
            chatHeader.textContent = `Диалог с ${friendName}`;
            inputArea.style.display = 'flex';
            messagesEl.innerHTML = '';

            if (currentMessagesRef) currentMessagesRef.off();
            const chatId = currentUser.uid < friendUid ? `${currentUser.uid}_${friendUid}` : `${friendUid}_${currentUser.uid}`;
            currentMessagesRef = db.ref(`chats/${chatId}/messages`);

            currentMessagesRef.on('child_added', (snap) => {
                const msg = snap.val();
                const isMe = msg.senderId === currentUser.uid;
                const bubble = document.createElement('div');
                bubble.className = 'msg-bubble ' + (isMe ? 'msg-me' : 'msg-them');

                const date = msg.timestamp ? new Date(msg.timestamp) : new Date();
                const timeStr = date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');

                const textDiv = document.createElement('div');
                textDiv.textContent = msg.text;

                const timeSpan = document.createElement('span');
                timeSpan.className = 'msg-time';
                timeSpan.textContent = timeStr;

                bubble.append(textDiv, timeSpan);
                messagesEl.appendChild(bubble);
                messagesEl.scrollTop = messagesEl.scrollHeight;
            });
        }

        // Отправка сообщения
        function sendDM() {
            const text = dmInput.value.trim();
            if (!text || !selectedFriend || !currentUser) return;
            const chatId = currentUser.uid < selectedFriend.uid ? `${currentUser.uid}_${selectedFriend.uid}` : `${selectedFriend.uid}_${currentUser.uid}`;
            dmInput.value = '';
            db.ref(`chats/${chatId}/messages`).push({
                senderId: currentUser.uid,
                text,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        document.getElementById('btn-send-dm').onclick = sendDM;
        dmInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendDM(); });
    </script>
</body>
</html>
