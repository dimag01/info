<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое пространство</title>
    <style>
        :root {
            --bg-dark: #0b0614;
            --card-bg: #150c25;
            --accent: #a855f7;
            --text-main: #f3efff;
            --text-muted: #a699c4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }
        /* Секции верхней и нижней частей сайта */
        .section-wrap {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
        }
        h1, h2 {
            margin-bottom: 12px;
            background: linear-gradient(90deg, #ffffff, #d8b4fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h1 { font-size: 28px; }
        h2 { font-size: 22px; }
        p { color: var(--text-muted); font-size: 16px; }

        /* РАЗРЕЗ ВО ВСЮ ШИРИНУ ЭКРАНА */
        .pano-divider {
            width: 100%;
            height: 390px; /* Увеличили высоту разреза, чтобы поместилось больше деталей */
            position: relative;
            overflow: hidden;
            background: #07030d;
            border-top: 1px solid rgba(168, 85, 247, 0.45);
            border-bottom: 1px solid rgba(168, 85, 247, 0.45);
            box-shadow: 0 0 50px rgba(138, 43, 226, 0.18);
        }
        .pano-bg {
            position: absolute;
            top: -45%;
            left: 0;
            width: 100%;
            height: 130%;
            background-image: url('bg.jpg'); /* Убрали лишнее темное наложение */
            background-size: cover;
            background-position: center center; /* Выровняли строго по центру */
            will-change: transform;
        }


        .pano-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            box-shadow: inset 0 25px 40px -10px #0b0614, inset 0 -25px 40px -10px #0b0614;
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ЧАСТЬ САЙТА -->
    <div class="section-wrap">
        <section class="card">
            <h1>Привет, я в сети</h1>
            <p>Создаю цифровые проекты, люблю глубокий звук, мистический вечерний вайб и стильный минимализм. Это мое личное пространство в сети.</p>
        </section>
    </div>

    <!-- ПАНОРАМА В РАЗРЕЗ НА ВСЮ ШИРИНУ -->
    <div class="pano-divider" id="pano-win">
        <div class="pano-bg" id="pano-bg"></div>
        <div class="pano-vignette"></div>
    </div>

    <!-- НИЖНЯЯ ЧАСТЬ САЙТА -->
    <div class="section-wrap">
        <section class="card">
            <h2>Проекты и контакты</h2>
            <p>Здесь скоро появятся ссылки на мои соцсети, плейлисты и визуальные работы. Продолжаем наполнять пространство.</p>
        </section>
    </div>

<script>
    const win = document.getElementById('pano-win');
    const bg = document.getElementById('pano-bg');
    let smooth = 0;

    function animatePanorama() {
        const vh = window.innerHeight || 800;
        const rect = win.getBoundingClientRect();
        const norm = Math.max(-1, Math.min(1, ((rect.top + rect.height * 0.5) - vh * 0.5) / (vh * 0.5)));
        
        smooth += (norm - smooth) * 0.1;

        const moveY = (-smooth * 55).toFixed(2);
        const scale = (1.1 - Math.abs(smooth) * 0.03).toFixed(3);

        bg.style.transform = `translate3d(0, ${moveY}px, 0) scale(${scale})`;
        requestAnimationFrame(animatePanorama);
    }
    animatePanorama();
</script>

</body>
</html>
