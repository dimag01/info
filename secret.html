<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Полночь в штабе 🔮</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💜</text></svg>">
    <style>
        :root {
            --bg-dark: #0b0614;
            --card-bg: rgba(18, 10, 32, 0.9);
            --text-main: #f3efff;
            --text-muted: #a699c4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background-image: radial-gradient(circle at 50% 15%, rgba(168, 85, 247, 0.16) 0%, #0b0614 80%);
        }
        .vn-wrap {
            width: 100%;
            max-width: 720px;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .vn-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .nav-btn {
            color: #d8b4fe;
            text-decoration: none;
            background: rgba(168, 85, 247, 0.14);
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 6px 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-btn:hover { background: rgba(168, 85, 247, 0.32); }
        .affinity-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 12px;
            background: rgba(232, 121, 249, 0.14);
            border: 1px solid rgba(232, 121, 249, 0.35);
            color: #f5d0fe;
            font-weight: 600;
        }
        .stage {
            position: relative;
            width: 100%;
            height: 360px;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(168, 85, 247, 0.3);
            background: #090412 url('bg_hq.png') center/cover no-repeat;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .stage::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(11,6,20,0.15) 0%, rgba(11,6,20,0.55) 100%);
            pointer-events: none;
        }
        .char-sprite {
            position: relative;
            z-index: 2;
            max-height: 94%;
            max-width: 90%;
            object-fit: contain;
            border-radius: 14px 14px 0 0;
            filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.85));
            transition: opacity 0.3s ease, transform 0.35s ease;
        }
        .char-sprite.ending-art {
            max-height: 100%;
            max-width: 100%;
            height: 100%;
            width: 100%;
            object-fit: contain;
            background: #0b0614;
            border-radius: 0;
        }
        .char-sprite.hidden {
            opacity: 0;
            transform: translateY(12px) scale(0.97);
        }
        .scene-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 3;
            font-size: 12px;
            color: #e9d5ff;
            background: rgba(11, 6, 20, 0.78);
            backdrop-filter: blur(6px);
            padding: 5px 12px;
            border-radius: 10px;
            border: 1px solid rgba(168, 85, 247, 0.35);
        }
        .dialogue-card {
            background: rgba(11, 6, 20, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.32);
            border-radius: 18px;
            padding: 18px 20px;
            min-height: 124px;
            cursor: pointer;
            user-select: none;
        }
        .speaker {
            font-size: 14px;
            font-weight: 700;
            color: #a3e635;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        .speaker.lelouch { color: #c084fc; }
        .speaker.narrator { color: #94a3b8; font-style: italic; }
        .text-line {
            font-size: 15px;
            line-height: 1.6;
            color: #f3efff;
        }
        .choices-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .choice-btn {
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            border-radius: 14px;
            background: rgba(168, 85, 247, 0.14);
            border: 1px solid rgba(168, 85, 247, 0.35);
            color: #f3efff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .choice-btn:hover {
            background: rgba(168, 85, 247, 0.32);
            border-color: #d8b4fe;
            transform: translateX(4px);
        }
    </style>
</head>
<body>
    <div class="vn-wrap">
        <div class="vn-header">
            <a href="index.html" class="nav-btn">← На главную</a>
            <span style="color: #a699c4; font-size: 12px;">Штаб Чёрных Рыцарей • 02:14</span>
            <div class="affinity-badge">💜 Близость: <span id="affinity-val">0</span></div>
        </div>

        <div class="stage">
            <div class="scene-tag" id="scene-tag">Глава 1 • Полночь и пицца</div>
            <img id="char-sprite" class="char-sprite" src="cc_pizza.png" alt="C.C.">
        </div>

        <div class="dialogue-card" onclick="skipTypewriter()">
            <div class="speaker" id="speaker-name">C.C.</div>
            <div class="text-line" id="dialogue-text"></div>
        </div>

        <div class="choices-box" id="choices-box"></div>
    </div>

<script>
    const scenes = {
        start: {
            tag: "Глава 1 • Полночь и пицца",
            sprite: "cc_pizza.png",
            speaker: "C.C.",
            speakerClass: "",
            text: "Опять сидишь над доской в два часа ночи, великий Зеро? Если ты свалишься от недосыпа раньше времени, кто будет выполнять моё желание?",
            choices: [
                { text: "Я просчитываю следующий ход. А ты снова потратила бюджет на пиццу?", next: "s1_tease", love: 1 },
                { text: "Спасибо, что принесла еду, C.C. Садись, на сегодня с планами покончено.", next: "s1_soft", love: 2 },
                { text: "Император не имеет права на отдых, пока мир не изменился.", next: "s1_cold", love: 0 }
            ]
        },
        s1_tease: {
            tag: "Глава 1 • Сообщники",
            sprite: "cc_smirk.png",
            speaker: "C.C.",
            speakerClass: "",
            text: "Считай это платой за то, что я прикрываю твою спину. И да — сырная корочка сама себя не съест, так что отодвинь свои карты.",
            choices: [
                { text: "«Сдаюсь. На твоей стороне всегда слишком веские аргументы».", next: "s2_chess", love: 2 },
                { text: "«Ладно, но только на одну партию в шахматы».", next: "s2_chess", love: 1 }
            ]
        },
        s1_soft: {
            tag: "Глава 1 • Без маски",
            sprite: "cc_smile.png",
            speaker: "C.C.",
            speakerClass: "",
            text: "Хм... Неожиданно послушный тон для того, кто собирается перевернуть мир. Не привыкай, я пришла только потому, что в коридоре было слишком тихо.",
            choices: [
                { text: "«Рядом с тобой мне не нужно притворяться Зеро».", next: "s2_chess", love: 2 },
                { text: "«Признай, ты просто соскучилась по моей компании».", next: "s2_chess", love: 2 }
            ]
        },
        s1_cold: {
            tag: "Глава 1 • Упрямство",
            sprite: "cc_smirk.png",
            speaker: "C.C.",
            speakerClass: "",
            text: "Какой же ты упрямый, Лелуш. Прямо как ребёнок, который боится упустить хоть одну фигуру с доски.",
            choices: [
                { text: "Вздохнуть и отложить бумаги: «Ты права. Давай сделаем перерыв».", next: "s2_chess", love: 1 },
                { text: "«Тогда сыграй со мной. Если победишь — я лягу спать».", next: "s2_chess", love: 1 }
            ]
        },
        s2_chess: {
            tag: "Глава 2 • Партия под луной",
            sprite: "cc_smirk.png",
            speaker: "C.C.",
            speakerClass: "",
            text: "Она садится напротив, откусывает кусочек пиццы и двигает белую пешку на e4. «Знаешь, Лелуш... Люди вокруг тебя видят либо спасителя, либо демона. И только я вижу просто уставшего парня».",
            choices: [
                { text: "Положить ладонь поверх её руки на краю доски: «И мне этого достаточно».", next: "s3_climax", love: 3 },
                { text: "«Потому что мы связаны контрактом. Я сдержу слово и подарю тебе улыбку».", next: "s3_climax", love: 2 },
                { text: "Сделать ход конём: «Сентиментальность тебе не идёт, C.C.»", next: "s3_climax", love: 0 }
            ]
        },
        s3_climax: {
            tag: "Глава 3 • Шах и мат",
            sprite: "cc_smile.png",
            speaker: "C.C.",
            speakerClass: "",
            text: "Лунный свет падает на доску. На миг её привычное спокойствие тает, и на щеках появляется лёгкий румянец: «Иногда ты говоришь такие вещи, от которых даже бессмертной ведьме становится не по себе... Чего ты хочешь прямо сейчас, Лелуш?»",
            choices: [
                { text: "Опрокинуть своего короля: «Забыть про войну до утра. Просто побудь со мной».", next: "check_ending", love: 2 },
                { text: "«Доиграть эту партию вничью и доесть пиццу под луной».", next: "check_ending", love: 1 },
                { text: "Попытаться просчитать ещё один ход на завтрашний день...", next: "end_sleep", love: 0 }
            ]
        },
        end_love: {
            tag: "Финал I • Вечный контракт 💜",
            sprite: "ending_love.png",
            isEndingArt: true,
            speaker: "C.C.",
            speakerClass: "",
            text: "Шахматная партия так и осталась недоигранной. C.C. тихо вздыхает, опускает голову тебе на плечо и закрывает глаза: «Только до рассвета, Лелуш. Сегодня можешь не быть ни Зеро, ни императором... Просто останься рядом».",
            choices: [
                { text: "🔄 Пройти заново и открыть другие концовки", next: "restart", love: 0 }
            ]
        },
        end_draw: {
            tag: "Финал II • Ничья на доске ✨",
            sprite: "cc_smile.png",
            speaker: "C.C.",
            speakerClass: "",
            text: "На доске остаётся по одному королю. C.C. усмехается, забирая последний кусок пиццы: «Похоже, сегодня никто не победил. Но эта ночь оказалась куда приятнее, чем я думала, сообщник».",
            choices: [
                { text: "🔄 Пройти заново и попробовать открыть идеальный финал", next: "restart", love: 0 }
            ]
        },
        end_sleep: {
            tag: "Финал III • Уснувший стратег 🍕",
            sprite: "cc_pizza.png",
            speaker: "Рассказчик",
            speakerClass: "narrator",
            text: "Не успев сделать ход, Лелуш засыпает прямо за столом. C.C. качает головой, накидывает ему на плечи свой плащ и тихо шепчет: «Совсем как ребёнок... Спи, дурак».",
            choices: [
                { text: "🔄 Пройти заново", next: "restart", love: 0 }
            ]
        }
    };

    let affinity = 0;
    let typingTimer = null;
    let fullTextCache = "";
    let isTyping = false;

    const tagEl = document.getElementById('scene-tag');
    const spriteEl = document.getElementById('char-sprite');
    const speakerEl = document.getElementById('speaker-name');
    const textEl = document.getElementById('dialogue-text');
    const choicesEl = document.getElementById('choices-box');
    const affinityEl = document.getElementById('affinity-val');

    function typeWriter(text) {
        clearInterval(typingTimer);
        fullTextCache = text;
        textEl.textContent = "";
        isTyping = true;
        let i = 0;
        typingTimer = setInterval(() => {
            textEl.textContent += text.charAt(i);
            i++;
            if (i >= text.length) {
                clearInterval(typingTimer);
                isTyping = false;
            }
        }, 22);
    }

    window.skipTypewriter = function() {
        if (isTyping) {
            clearInterval(typingTimer);
            textEl.textContent = fullTextCache;
            isTyping = false;
        }
    };

    function renderScene(sceneKey) {
        if (sceneKey === "restart") {
            affinity = 0;
            affinityEl.textContent = affinity;
            sceneKey = "start";
        }
        if (sceneKey === "check_ending") {
            sceneKey = affinity >= 6 ? "end_love" : "end_draw";
        }

        const scene = scenes[sceneKey];
        tagEl.textContent = scene.tag;
        speakerEl.textContent = scene.speaker;
        speakerEl.className = "speaker " + (scene.speakerClass || "");

        // Плавная смена спрайта
        spriteEl.classList.add('hidden');
        setTimeout(() => {
            spriteEl.src = scene.sprite;
            if (scene.isEndingArt) {
                spriteEl.classList.add('ending-art');
            } else {
                spriteEl.classList.remove('ending-art');
            }
            spriteEl.classList.remove('hidden');
        }, 180);

        typeWriter(scene.text);

        choicesEl.innerHTML = "";
        scene.choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = choice.text;
            btn.onclick = () => {
                affinity += (choice.love || 0);
                affinityEl.textContent = affinity;
                renderScene(choice.next);
            };
            choicesEl.appendChild(btn);
        });
    }

    // Старт первой сцены
    renderScene("start");
</script>
</body>
</html>
