<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗝️</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0614;
            color: #f3efff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            max-width: 460px;
            width: 100%;
            background: rgba(21, 12, 37, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 24px;
            padding: 32px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #d8b4fe;
        }
        p {
            color: #a699c4;
            font-size: 15px;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 12px;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.45);
            color: #f3efff;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn:hover {
            background: rgba(168, 85, 247, 0.35);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🗝️ Секретная вкладка</h1>
        <p>Страница в разработке...</p>
        <a href="index.html" class="btn">← На главную</a>
    </div>
</body>
</html>
